# Publishes the project site (website/) to GitHub Pages.
# Enable it in the repository settings: Pages > Build and deployment > Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths: ['website/**', 'src/**', 'playground/**', 'docs/**', '*.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      # The playground of the site is built from the package itself.
      - run: yarn install --immutable
      - name: Generate the static site
        working-directory: website
        run: |
          yarn install --immutable
          yarn playground
          yarn generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.output/public
      - id: deployment
        uses: actions/deploy-pages@v4
